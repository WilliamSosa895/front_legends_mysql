<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Consumo de REST-API de Jugadores</title>
  <style>
    body {
      background: #66bb6a; /* verde suave */
      color: #fff;
      font-family: 'Arial', sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      text-shadow: 2px 2px #000;
      margin-bottom: 30px;
    }

    .form-container {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-container div {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 100px;
    }

    input {
      border: 2px solid #fff;
      border-radius: 4px;
      padding: 5px;
      width: calc(100% - 120px);
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    button {
      background: #daa520; /* dorado más definido */
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      color: #000;
    }

    button:hover {
      background: #cfa300;
    }

    table {
      font-size: 0.8rem;
      width: auto;
      margin: 20px auto;
      border-collapse: collapse;
      background: rgba(255,255,255,0.2);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: center;
      color: #fff;
      white-space: nowrap;
    }

    th {
      background: rgba(0, 0, 0, 0.3);
      color: #f0f0f0;
      font-size: 0.85rem;
    }

    .actions {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    #resultado {
      max-width: 95%;
      margin: 20px auto;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Leyendas De Fútbol</h1>

  <!-- Formulario para crear/editar -->
  <div class="form-container">
    <input type="hidden" id="jugadorId">
    <div><label>Name</label><input type="text" id="name"></div>
    <div><label>Status</label><input type="text" id="estado"></div>
    <div><label>Last Club</label><input type="text" id="ultimoClub"></div>
    <div><label>Titles</label><input type="number" id="numeroTitulos"></div>
    <div><label>Goals</label><input type="number" id="numeroGoles"></div>
    <div><label>Ballon d'Or</label><input type="number" id="balonesDeOro"></div>
    <div><label>World Cups</label><input type="number" id="mundialesGanados"></div>
    <button onclick="postJugador()">POST Jugador</button>
    <button onclick="updateJugador()">PUT update Jugador</button>
    <button onclick="getJugadores()">GET Jugadores</button>
  </div>

  <div id="resultado"></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="callrestapi.js"></script>
</body>
</html>
